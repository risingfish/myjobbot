services:
  myjobbot:
    build: .
    image: myjobbot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MYJOBBOT_DATA_DIR: /data
      MYJOBBOT_LOG_DIR: /data/log
    volumes:
      - ./data:/data

  web:
    image: myjobbot:latest
    restart: unless-stopped
    command: ["serve"]
    env_file: .env
    environment:
      MYJOBBOT_DATA_DIR: /data
      MYJOBBOT_LOG_DIR: /data/log
      MYJOBBOT_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
