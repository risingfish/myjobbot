x-rebuild-on-dependency-change: &rebuild-on-dependency-change
    watch:
        - path: package.json
          action: rebuild
        - path: package-lock.json
          action: rebuild
        - path: Dockerfile
          action: rebuild
        - path: docker
          action: rebuild
        - path: web/next.config.ts
          action: rebuild
        - path: web/tsconfig.json
          action: rebuild

services:
    myjobbot:
        build: .
        image: myjobbot:latest
        restart: unless-stopped
        env_file: .env
        environment:
            MYJOBBOT_DATA_DIR: /data
            MYJOBBOT_LOG_DIR: /data/log
        volumes:
            - ./data:/data
            - ./src:/app/src:ro
        networks: [default, browser]
        develop: *rebuild-on-dependency-change

    web:
        build: .
        image: myjobbot:latest
        restart: unless-stopped
        command: ["serve"]
        env_file: .env
        environment:
            MYJOBBOT_DATA_DIR: /data
            MYJOBBOT_LOG_DIR: /data/log
            NEXT_DIST_DIR: .next-docker
        ports:
            - "${MYJOBBOT_PORT:-8080}:${MYJOBBOT_PORT:-8080}"
        volumes:
            - ./data:/data
            - ./src:/app/src:ro
            - ./web:/app/web
        networks: [default, browser]
        develop: *rebuild-on-dependency-change

    searxng:
        image: searxng/searxng:2026.10.15-b00212a83
        profiles: ["search"]
        restart: unless-stopped
        environment:
            SEARXNG_SECRET: ${SEARXNG_SECRET:-}
        volumes:
            - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

    browser:
        image: mcr.microsoft.com/playwright:v1.64.1-noble
        profiles: ["browser"]
        restart: unless-stopped
        init: true
        user: pwuser
        working_dir: /home/pwuser
        shm_size: 1gb
        command: ["npx", "-y", "playwright@1.64.1", "run-server", "--port", "3000", "--host", "0.0.0.0"]
        networks: [browser]

networks:
    browser:
        ipam:
            config:
                - subnet: 172.31.250.0/24
