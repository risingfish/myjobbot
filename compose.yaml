x-rebuild-on-dependency-change: &rebuild-on-dependency-change
  watch:
    - path: package.json
      action: rebuild
    - path: package-lock.json
      action: rebuild
    - path: Dockerfile
      action: rebuild
    - path: docker
      action: rebuild

services:
  myjobbot:
    build: .
    image: myjobbot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MYJOBBOT_DATA_DIR: /data
      MYJOBBOT_LOG_DIR: /data/log
    volumes:
      - ./data:/data
      - ./src:/app/src:ro
    develop: *rebuild-on-dependency-change

  web:
    build: .
    image: myjobbot:latest
    restart: unless-stopped
    command: ["serve"]
    env_file: .env
    environment:
      MYJOBBOT_DATA_DIR: /data
      MYJOBBOT_LOG_DIR: /data/log
      MYJOBBOT_HOST: 0.0.0.0
      MYJOBBOT_WATCH: "1"
    ports:
      - "${MYJOBBOT_PORT:-8080}:${MYJOBBOT_PORT:-8080}"
    volumes:
      - ./data:/data
      - ./src:/app/src:ro
    develop: *rebuild-on-dependency-change
