apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myjobbot.fullname" . }}-web
  labels:
    {{- include "myjobbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "myjobbot.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myjobbot.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/secret: {{ .Values.secret.values | toJson | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with include "myjobbot.seedContainers" . }}
      initContainers:
        {{- . | trim | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "myjobbot.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "myjobbot.env" . | nindent 12 }}
            - name: MYJOBBOT_WEB_MODE
              value: production
            - name: MYJOBBOT_PORT
              value: {{ .Values.web.port | quote }}
            - name: MYJOBBOT_HOSTS
              value: {{ include "myjobbot.hosts" . | quote }}
            - name: MYJOBBOT_BASE_URL
              value: {{ include "myjobbot.baseUrl" . | quote }}
            - name: MYJOBBOT_TRUSTED_PROXIES
              value: {{ include "myjobbot.trustedProxies" . | quote }}
          envFrom:
            {{- include "myjobbot.envFrom" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: {{ printf "localhost:%v" .Values.web.port | quote }}
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
        {{- if .Values.monitoring.enabled }}
        - name: metrics
          image: {{ include "myjobbot.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["metrics"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "myjobbot.env" . | nindent 12 }}
            - name: MYJOBBOT_METRICS_PORT
              value: {{ .Values.monitoring.port | quote }}
          envFrom:
            {{- include "myjobbot.envFrom" . | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.monitoring.port }}
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.monitoring.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
        {{- end }}
      volumes:
        {{- include "myjobbot.volumes" . | nindent 8 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myjobbot.fullname" . }}-web
  labels:
    {{- include "myjobbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "myjobbot.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
