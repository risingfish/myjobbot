{{- if and .Values.monitoring.enabled .Values.monitoring.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myjobbot.fullname" . }}-dashboard
  labels:
    {{- include "myjobbot.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  myjobbot.json: |-
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
