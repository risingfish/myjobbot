name: Chart

on:
    push:
        branches: [main]
        tags: ["v*"]

permissions:
    contents: read

env:
    CHART: deploy/helm/myjobbot
    HELM_VERSION: v4.3.1
    KUBECONFORM_VERSION: v0.8.0
    KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    KUBERNETES_VERSION: 1.33.0

jobs:
    chart:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Install kubeconform
              run: |
                  curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
                  echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
                  tar -xzf kubeconform.tar.gz -C /usr/local/bin kubeconform

            - name: SearXNG settings match compose
              run: diff docker/searxng/settings.yml "$CHART/files/searxng-settings.yml"

            - name: Lint
              run: |
                  helm lint "$CHART" --set secret.existingSecret=myjobbot-env
                  helm lint "$CHART" -f "$CHART/ci/all-on-values.yaml"

            - name: Validate rendered manifests
              run: |
                  helm template t "$CHART" --set secret.existingSecret=myjobbot-env \
                    | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -
                  helm template t "$CHART" -f "$CHART/ci/all-on-values.yaml" \
                    | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -

            - name: Push chart
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  OWNER: ${{ github.repository_owner }}
                  ACTOR: ${{ github.actor }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  helm package "$CHART" --version "$version" --app-version "$version"
                  echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
                  helm push "myjobbot-${version}.tgz" "oci://ghcr.io/${OWNER}/charts"
